  properties:
  - url: https://github.com/buzzsprout/buzzsprout-api
    type: Documentation
  - url: https://github.com/buzzsprout/buzzsprout-api/blob/master/sections/episodes.md
    type: APIReference
  - url: openapi/buzzsprout-openapi.yml
    type: OpenAPI
  - url: collections/buzzsprout.postman_collection.json
    type: PostmanCollection
  - url: collections/buzzsprout.opencollection.json
    type: OpenCollection
  description: List, retrieve, create, and update the episodes on a Buzzsprout podcast.
    Episodes are scoped to a podcast id at /api/{podcast_id}/episodes.json, and audio
    can be attached by URL or file upload with optional email notification after
    processing. Requests are SSL-only and token-authenticated.
- aid: buzzsprout:buzzsprout-podcasts-api
  name: Buzzsprout Podcasts API
  tags:
  - Podcasts
  - Directories
  - Metadata
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/buzzsprout/buzzsprout-api/blob/master/sections/podcasts.md
  baseURL: https://www.buzzsprout.com/api
  properties:
  - url: https://github.com/buzzsprout/buzzsprout-api
    type: Documentation
  - url: https://github.com/buzzsprout/buzzsprout-api/blob/master/sections/podcasts.md
    type: APIReference
  - url: openapi/buzzsprout-openapi.yml
    type: OpenAPI
  - url: collections/buzzsprout.postman_collection.json
    type: PostmanCollection
  - url: collections/buzzsprout.opencollection.json
    type: OpenCollection
  description: List the podcasts on a Buzzsprout account at /api/podcasts.json,
    returning each show's title, author, description, contact email, categories,
    language, timezone, artwork, and website. Used to discover podcast ids that
    scope the Episodes API.
