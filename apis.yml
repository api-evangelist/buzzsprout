aid: buzzsprout
url: https://raw.githubusercontent.com/api-evangelist/buzzsprout/refs/heads/main/apis.yml
name: Buzzsprout
kind: company
description: Buzzsprout is a podcast hosting platform that handles hosting, distribution,
  promotion, and analytics for podcasters - uploading and optimizing audio, publishing
  an RSS feed, listing shows in directories like Apple Podcasts and Spotify, and
  reporting on plays. Buzzsprout also exposes a documented public REST API (base
  https://www.buzzsprout.com/api) so third parties can programmatically read and
  manage the podcasts and episodes on an account. The API is RESTful, JSON-serialized,
  SSL-only, and authenticated with a per-account token.
