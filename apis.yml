- aid: buzzsprout:buzzsprout-episodes-api
  name: Buzzsprout Episodes API
  tags:
  - Episodes
  - Audio
  - Publishing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/buzzsprout/buzzsprout-api/blob/master/sections/episodes.md
