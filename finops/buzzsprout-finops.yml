description: >-
  FinOps view of Buzzsprout spend. Buzzsprout bills a flat monthly subscription
  selected by upload-hour allowance rather than by API calls - the REST API is
  included at no separate charge. The dominant cost drivers are the chosen plan
  tier (upload hours), any overage above the allowance, and optional add-ons
  (Cohost AI, Magic Mastering) billed on top of the base plan. Annual billing is
  cheaper than month-to-month. Because API access carries no incremental fee,
  cost optimization is about right-sizing the plan to actual monthly upload
  volume and controlling add-on subscriptions.
notes: >-
  Per-unit overage and add-on rates are not reconciled here; verify current
  numbers on the Buzzsprout pricing page. There is no usage-metered API billing
  to track - spend is subscription plus add-ons.
