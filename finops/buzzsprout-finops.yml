meters:
- name: plan_subscription
  description: Monthly (or annual) subscription fee for the selected upload-hour tier.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - plan
- name: upload_hours
  description: Audio upload hours consumed against the plan allowance.
  unit: hours
  aggregation: sum
  dimensions:
  - account
  - podcast
- name: addons
  description: Optional add-on subscriptions such as Cohost AI and Magic Mastering.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - addon
principles:
- name: Visibility
  description: Track the plan tier, upload hours consumed, and any active add-ons per account.
- name: Allocation
  description: On Multi-Podcast plans, attribute shared upload hours to individual shows to map cost to each podcast.
- name: Optimization
  description: Right-size the plan to actual monthly upload volume, prefer annual billing, and disable unused add-ons; the REST API adds no incremental cost.
- name: Accountability
  description: Assign an owner per account and review monthly plan tier and add-ons against actual upload usage.
